name: Deploy portfolio website

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "scripts/verify_public_dashboard.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for artifact verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify public artifact allowlist and aggregate sources
        run: python scripts/verify_public_dashboard.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
